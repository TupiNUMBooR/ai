services:
  ollama:
    # https://hub.docker.com/r/ollama/ollama
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    # Раскомментируйте этот блок, чтобы запускать модели на видеокарте NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    restart: always
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3001:8080"
    volumes:
      - ./open-webui:/app/backend/data
